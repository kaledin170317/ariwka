- name: Node deployment
  hosts: nodes
  become: true
  gather_facts: false
  
  tasks:
    - name: Init
      tags:
        - init
      block:
        - name: Install dependencies
          ansible.builtin.apt:
            name:
              - curl
              - ca-certificates
            update_cache: true
            state: present

    - name: Setup
      tags:
        - setup
      block:

        - name: Create environment file
          ansible.builtin.copy:
            content: |
              SERVER_HOST={{ ansible_host }}
            dest: /etc/default/node
            mode: "0644"

        - name: Copy systemd service
          ansible.builtin.copy:
            src:  artefacts/node.service
            dest: /etc/systemd/system/node.service
            mode: "0644"

        - name: Enable service
          ansible.builtin.systemd_service:
            name: node
            enabled: true
            daemon_reload: true

    - name: Xray
      tags:
        - setup
        - deploy
      block:
        - name: Install Docker
          ansible.builtin.apt:
            name:
              - docker.io
              - docker-compose
            update_cache: true
            state: present

        - name: Start Docker
          ansible.builtin.systemd_service:
            name: docker
            enabled: true
            state: started

        - name: Create Xray config directory
          ansible.builtin.file:
            path: /etc/xray
            state: directory
            mode: "0755"

        - name: Generate Hysteria certificate
          ansible.builtin.command:
            cmd: >
              openssl req -x509 -newkey rsa:2048 -nodes
              -keyout /etc/xray/hy2_key.pem
              -out /etc/xray/hy2_cert.pem
              -days 3650
              -subj /CN=vpn
            creates: /etc/xray/hy2_cert.pem

        - name: Set Hysteria key permissions
          ansible.builtin.file:
            path: /etc/xray/hy2_key.pem
            mode: "0600"

        - name: Copy Xray config
          ansible.builtin.copy:
            src: artefacts/xray.json
            dest: /etc/xray/config.json
            mode: "0644"

        - name: Copy Xray Compose file
          ansible.builtin.copy:
            src: artefacts/xray.yml
            dest: /etc/xray/compose.yml
            mode: "0644"

        - name: Stop old sing-box service if installed
          ansible.builtin.shell: systemctl disable --now sing-box
          register: old_sing_box
          changed_when: old_sing_box.rc == 0
          failed_when: false

        - name: Recreate Xray container with current config
          ansible.builtin.command: docker-compose -f /etc/xray/compose.yml up -d --force-recreate

    - name: Deploy
      tags:
        - setup
        - deploy
      block:
        - name: Copy binary
          ansible.builtin.copy:
            src: ../../bin/node
            dest: /usr/local/bin/node
            mode: "0755"

        - name: Restart service
          ansible.builtin.systemd_service:
            name: node
            state: restarted
