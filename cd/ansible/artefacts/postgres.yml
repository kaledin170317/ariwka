services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file: /etc/control/.env
    environment:
      POSTGRES_USER: control
      POSTGRES_DB: control
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control -d control"]
      interval: 5s
      retries: 12

volumes:
  postgres-data:
