- name: Telegram bot deployment
  hosts: control
  become: true
  gather_facts: false

  tasks:
    - name: Setup
      tags:
        - setup
      block:
        - name: Copy systemd service
          ansible.builtin.copy:
            src: artefacts/telegram.service
            dest: /etc/systemd/system/telegram.service
            mode: "0644"

        - name: Enable bot service
          ansible.builtin.systemd_service:
            name: telegram
            enabled: true
            daemon_reload: true

    - name: Deploy
      tags:
        - setup
        - deploy
      block:
        - name: Copy bot binary
          ansible.builtin.copy:
            src: ../../bin/telegram
            dest: /usr/local/bin/telegram
            mode: "0755"

        - name: Restart bot service
          ansible.builtin.systemd_service:
            name: telegram
            state: restarted
