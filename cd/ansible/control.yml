- name: Control deployment
  hosts: control
  become: true
  gather_facts: false
  
  tasks:
    - name: Setup
      tags:
        - setup
      block:
        - name: Install dependencies
          ansible.builtin.apt:
            name:
              - curl
              - ca-certificates
              - openssl
              - docker.io
              - docker-compose
            update_cache: true
            state: present

        - name: Start Docker
          ansible.builtin.systemd_service:
            name: docker
            enabled: true
            state: started

        - name: Create control directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: "0700"
          loop:
            - /var/lib/control
            - /var/lib/control/certs
            - /etc/control

        - name: Stop previous host PostgreSQL
          ansible.builtin.service_facts:

        - name: Disable previous host PostgreSQL
          ansible.builtin.systemd_service:
            name: postgresql
            state: stopped
            enabled: false
          when: "'postgresql.service' in ansible_facts.services"

    - name: Copy secrets
      tags:
        - setup
        - deploy
      ansible.builtin.copy:
        src: ../../.env
        dest: /etc/control/.env
        mode: "0600"
      no_log: true

    - name: Start PostgreSQL container
      tags:
        - setup
      block:
        - name: Copy PostgreSQL Compose file
          ansible.builtin.copy:
            src: artefacts/postgres.yml
            dest: /etc/control/postgres.yml
            mode: "0644"

        - name: Run PostgreSQL Compose
          ansible.builtin.command: docker-compose --env-file /etc/control/.env -f /etc/control/postgres.yml up -d --wait

    - name: Deploy
      tags:
        - setup
        - deploy
      block:
        - name: Copy systemd service
          ansible.builtin.copy:
            src: artefacts/control.service
            dest: /etc/systemd/system/control.service
            mode: "0644"

        - name: Enable service
          ansible.builtin.systemd_service:
            name: control
            enabled: true
            daemon_reload: true

        - name: Create migrations directory
          ansible.builtin.file:
            path: /usr/share/control/migrations
            state: directory
            mode: "0755"

        - name: Copy migrate binary
          ansible.builtin.copy:
            src: ../../bin/migrate
            dest: /usr/local/bin/migrate
            mode: "0755"

        - name: Copy migrations
          ansible.builtin.copy:
            src: ../../migrations/control/
            dest: /usr/share/control/migrations/
            mode: "0644"
        
        - name: Apply database migrations
          ansible.builtin.shell: >-
            . /etc/control/.env &&
            /usr/local/bin/migrate -path /usr/share/control/migrations
            -database "$DATABASE_URL" up
          register: migration
          changed_when: >
            'no change' not in migration.stdout | lower and
            'no change' not in migration.stderr | lower

        - name: Copy binary
          ansible.builtin.copy:
            src: ../../bin/control
            dest: /usr/local/bin/control
            mode: "0755"

        - name: Restart service
          ansible.builtin.systemd_service:
            name: control
            state: restarted
