syntax = "proto3";

package control;

option go_package = "vpn/gen/control;control";

import "control/user.proto";

service AuthService {
  rpc Register(RegisterRequest) returns (User);

  rpc Login(LoginRequest) returns (LoginResponse);
  rpc LoginTelegramUser(LoginTelegramUserRequest) returns (LoginResponse);
}

message RegisterRequest {
  string username = 1;
  string password = 2;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
}

message LoginTelegramUserRequest {
  int64 telegram_id = 1;
}
