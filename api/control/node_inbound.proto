syntax = "proto3";

package control;

option go_package = "vpn/gen/control;control";

import "vpn/common/common.proto";

service NodeInboundService {
  rpc List(ListNodeInboundsRequest) returns (ListNodeInboundsResponse);
  rpc Create(CreateNodeInboundRequest) returns (CreateNodeInboundResponse);
  rpc Delete(DeleteNodeInboundRequest) returns (DeleteNodeInboundResponse);
}

message ListNodeInboundsRequest {}
message NodeInbound {
  string node_id = 1;
  vpn.common.Inbound inbound = 2;
}
message ListNodeInboundsResponse { repeated NodeInbound inbounds = 1; }

message CreateNodeInboundRequest {
  string node_id = 1;
  int32 port = 2;
  oneof details {
    Hysteria2InboundOptions hysteria2 = 3;
    VlessInboundOptions vless = 4;
  }
}
message Hysteria2InboundOptions {}
message VlessInboundOptions {
  string server_name = 1;
  vpn.common.VlessTransportOptions transport = 2;
}
message CreateNodeInboundResponse { vpn.common.Inbound inbound = 1; }

message DeleteNodeInboundRequest {
  string node_id = 1;
  string tag = 2;
}
message DeleteNodeInboundResponse {}
