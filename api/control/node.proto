syntax = "proto3";

package control;

option go_package = "vpn/gen/control;control";

service NodeService {
  rpc List(ListNodesRequest) returns (ListNodesResponse);
  rpc Create(CreateNodeRequest) returns (Node);
  rpc Delete(DeleteNodeRequest) returns (DeleteNodeResponse);
  rpc Update(UpdateNodeRequest) returns (Node);
}

message Node {
  string id = 1;
  string name = 2;
  string address = 3;
  string description = 4;
  string country = 5;
}

message CreateNodeRequest {
  string name = 1;
  string address = 2;
  string description = 3;
}

message UpdateNodeRequest {
  string id = 1;
  repeated NodeOption options = 2;
}

message NodeOption {
  oneof value {
    string name = 1;
    string address = 2;
    string description = 3;
  }
}

message DeleteNodeRequest { string id = 1; }
message DeleteNodeResponse {}
message ListNodesRequest {}
message ListNodesResponse { repeated Node nodes = 1; }
