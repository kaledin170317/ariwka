syntax = "proto3";

package control;

option go_package = "vpn/gen/control;control";

import "node/route.proto";

service NodeRouteRuleService {
  rpc List(ListNodeRouteRulesRequest) returns (ListNodeRouteRulesResponse);
  rpc Create(CreateNodeRouteRuleRequest) returns (CreateNodeRouteRuleResponse);
  rpc Delete(DeleteNodeRouteRuleRequest) returns (DeleteNodeRouteRuleResponse);
}

message ListNodeRouteRulesRequest { string node_id = 1; }
message ListNodeRouteRulesResponse { repeated vpn.v1.RouteRule rules = 1; }
message CreateNodeRouteRuleRequest {
  string node_id = 1;
  optional string user = 2;
  optional string rule_set = 3;
  vpn.v1.RouteAction action = 4;
  string outbound = 5;
}
message CreateNodeRouteRuleResponse {}
message DeleteNodeRouteRuleRequest {
  string node_id = 1;
  uint32 index = 2;
}
message DeleteNodeRouteRuleResponse {}
