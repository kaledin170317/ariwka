syntax = "proto3";

package control;

option go_package = "vpn/gen/control;control";

service RuleSetService {
  rpc List(ListRuleSetsRequest) returns (ListRuleSetsResponse);
  rpc Create(CreateRuleSetRequest) returns (CreateRuleSetResponse);
  rpc Delete(DeleteRuleSetRequest) returns (DeleteRuleSetResponse);
  rpc Update(UpdateRuleSetRequest) returns (UpdateRuleSetResponse);
}

message ManagedRuleSet {
  string tag = 1;
  string url = 2;
  RuleSetFormat format = 3;
}

enum RuleSetFormat {
  RULE_SET_FORMAT_UNSPECIFIED = 0;
  RULE_SET_FORMAT_SOURCE = 1;
  RULE_SET_FORMAT_BINARY = 2;
}

message CreateRuleSetRequest { ManagedRuleSet rule_set = 1; }
message CreateRuleSetResponse {}
message DeleteRuleSetRequest { string tag = 1; }
message DeleteRuleSetResponse {}
message UpdateRuleSetRequest { ManagedRuleSet rule_set = 1; }
message UpdateRuleSetResponse {}
message ListRuleSetsRequest {}
message ListRuleSetsResponse { repeated ManagedRuleSet rule_sets = 1; }
