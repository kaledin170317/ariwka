syntax = "proto3";

package control;

option go_package = "vpn/gen/control;control";


service UserService {
  rpc GetUsers(GetUsersRequest) returns (GetUsersResponse);
}

message User {
  string id = 1;
  string username = 2;
}

message GetUsersRequest {}

message GetUsersResponse {
  repeated User users = 1;
}
