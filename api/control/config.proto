syntax = "proto3";

package control;

option go_package = "vpn/gen/control;control";

service ConfigService {
  rpc CreateMyProfile(CreateMyProfileRequest) returns (CreateProfileResponse);
  rpc CreateUserProfile(CreateUserProfileRequest) returns (CreateProfileResponse);
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
}

message CreateMyProfileRequest {
  string node_id = 1;
  string inbound = 2;
}

message CreateUserProfileRequest {
  string user_id = 1;
  string node_id = 2;
  string inbound = 3;
}

message CreateProfileResponse { string id = 1; }
message GetConfigRequest {}

message GetConfigResponse { repeated string connections = 1; }

message GetProfileRequest { string id = 1; }
message GetProfileResponse { string connection = 1; }
