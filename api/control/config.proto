syntax = "proto3";

package control;

option go_package = "vpn/gen/control;control";

service ConfigService {
  rpc CreateMyProfile(CreateMyProfileRequest) returns (CreateProfileResponse);
  rpc CreateUserProfile(CreateUserProfileRequest) returns (CreateProfileResponse);
  rpc DeleteMyProfile(DeleteMyProfileRequest) returns (DeleteMyProfileResponse);
  rpc DeleteUserProfile(DeleteUserProfileRequest) returns (DeleteUserProfileResponse);
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc GetSubscriptionLink(GetSubscriptionLinkRequest) returns (GetSubscriptionLinkResponse);
  rpc GetDefaultSubscriptionLink(GetSubscriptionLinkRequest) returns (GetSubscriptionLinkResponse);
  rpc CreateMyDevice(CreateDeviceRequest) returns (Device);
  rpc ListMyDevices(ListDevicesRequest) returns (ListDevicesResponse);
  rpc DeleteMyDevice(DeleteDeviceRequest) returns (DeleteDeviceResponse);
}

message CreateMyProfileRequest {
  string node_id = 1;
  string inbound = 2;
}

message CreateUserProfileRequest {
  string user_id = 1;
  string node_id = 2;
  string inbound = 3;
}

message CreateProfileResponse {
  string id = 1;
  string connection = 2;
}

message DeleteMyProfileRequest { string id = 1; }
message DeleteMyProfileResponse {}
message DeleteUserProfileRequest {
  string user_id = 1;
  string id = 2;
}
message DeleteUserProfileResponse {}
message GetConfigRequest {}

message GetConfigResponse {
  repeated string connections = 1;
  repeated ProfileConnection profiles = 2;
}
message ProfileConnection {
  string id = 1;
  string connection = 2;
}

message GetProfileRequest { string id = 1; }
message GetProfileResponse { string connection = 1; }

message GetSubscriptionLinkRequest {}
message GetSubscriptionLinkResponse { string url = 1; }

message CreateDeviceRequest { string name = 1; }
message ListDevicesRequest {}
message ListDevicesResponse { repeated Device devices = 1; }
message DeleteDeviceRequest { string id = 1; }
message DeleteDeviceResponse {}
message Device {
  string id = 1;
  string name = 2;
  string url = 3;
  string hwid = 4;
}
