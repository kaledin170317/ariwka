syntax = "proto3";

package vpn.v1;

option go_package = "vpn/gen/node;node";

import "vpn/common/common.proto";

service VPNService {
  rpc AddRuleSet(AddRuleSetRequest) returns (AddRuleSetResponse);
  rpc GetRuleSets(GetRuleSetsRequest) returns (GetRuleSetsResponse);
  rpc AddRouteRule(AddRouteRuleRequest) returns (AddRouteRuleResponse);
  rpc GetInbounds(GetInboundsRequest) returns (GetInboundsResponse);
  rpc AddHysteria2Inbound(AddHysteria2InboundRequest) returns (AddHysteria2InboundResponse);
  rpc AddVlessInbound(AddVlessInboundRequest) returns (AddVlessInboundResponse);
  rpc RemoveInbound(RemoveInboundRequest) returns (RemoveInboundResponse);
  rpc AddUser(AddUserRequest) returns (AddUserResponse);
  rpc RemoveUser(RemoveUserRequest) returns (RemoveUserResponse);
}

message User {
  string name = 1;
  repeated string keys = 2;
}

message GetUsersRequest {}

message GetUsersResponse {
  repeated User users = 1;
}


message AddRuleSetRequest {
  string name = 1;
}

message AddRuleSetResponse {}



message GetRuleSetsRequest {}

message GetRuleSetsResponse {
  repeated string ruleSets = 1;
}

enum RouteAction {
  ROUTE_ACTION_UNSPECIFIED = 0;
  ROUTE_ACTION_REJECT = 1;
  ROUTE_ACTION_ROUTE = 2;
  ROUTE_ACTION_HIJACK_DNS = 3;
  ROUTE_ACTION_SNIFF = 4;
}

message AddRouteRuleRequest {
  optional string user = 1;
  optional string rule_set = 2;
  RouteAction action = 3;
}

message AddRouteRuleResponse{}


message GetInboundsRequest{}

message GetInboundsResponse{
  repeated InboundConnection inbounds = 1;
}

message InboundConnection {
  vpn.common.Inbound inbound = 1;
  repeated Hysteria2User hysteria2_users = 2;
  repeated string vless_users = 3;
}

message Hysteria2User {
  string name = 1;
  string password = 2;
}


message AddHysteria2InboundRequest {
  int32 port = 1;
}

message AddHysteria2InboundResponse {
  vpn.common.Inbound inbound = 1;
}

message AddVlessInboundRequest {
  int32 port = 1;
  string server_name = 2;
  vpn.common.VlessTransportOptions transport = 3;
}

message AddVlessInboundResponse {
  vpn.common.Inbound inbound = 1;
}

message RemoveInboundRequest { string tag = 1; }
message RemoveInboundResponse {}


message AddUserRequest {
  string inbound_tag = 1;
}

message VlessUser {
  string tag = 1;
  string uuid = 2;
}

message AddUserResponse {
  vpn.common.Inbound inbound = 1;
  oneof credentials {
    Hysteria2User hysteria2 = 2;
    VlessUser vless = 3;
  }
}

message RemoveUserRequest {
  string tag = 1;
  string inbound_tag = 2;
}

message RemoveUserResponse {}
