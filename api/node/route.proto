syntax = "proto3";

package vpn.v1;

option go_package = "vpn/gen/node;node";

service RouteService {
  rpc AddRuleSet(AddRuleSetRequest) returns (AddRuleSetResponse);
  rpc GetRuleSets(GetRuleSetsRequest) returns (GetRuleSetsResponse);
  rpc RemoveRuleSet(RemoveRuleSetRequest) returns (RemoveRuleSetResponse);
  rpc ModifyRuleSet(ModifyRuleSetRequest) returns (ModifyRuleSetResponse);
  rpc AddRouteRule(AddRouteRuleRequest) returns (AddRouteRuleResponse);
  rpc GetRouteRules(GetRouteRulesRequest) returns (GetRouteRulesResponse);
  rpc RemoveRouteRule(RemoveRouteRuleRequest) returns (RemoveRouteRuleResponse);
  rpc SyncDNSRoutes(SyncDNSRoutesRequest) returns (SyncDNSRoutesResponse);
}

message AddRuleSetRequest {
  string name = 1;
  string url = 2;
  string format = 3;
  uint32 update_interval_seconds = 4;
}
message AddRuleSetResponse {}
message GetRuleSetsRequest {}
message GetRuleSetsResponse { repeated RuleSet rule_sets = 1; }
message RuleSet {
  string name = 1;
  string url = 2;
  string format = 3;
  uint32 update_interval_seconds = 4;
}
message RemoveRuleSetRequest { string name = 1; }
message RemoveRuleSetResponse {}
message ModifyRuleSetRequest {
  string name = 1;
  string url = 2;
  string format = 3;
  uint32 update_interval_seconds = 4;
}
message ModifyRuleSetResponse {}

enum RouteAction {
  ROUTE_ACTION_UNSPECIFIED = 0;
  ROUTE_ACTION_REJECT = 1;
  ROUTE_ACTION_ROUTE = 2;
  ROUTE_ACTION_HIJACK_DNS = 3;
  ROUTE_ACTION_SNIFF = 4;
}
message AddRouteRuleRequest {
  optional string user = 1;
  optional string rule_set = 2;
  RouteAction action = 3;
  string outbound = 4;
}
message AddRouteRuleResponse {}
message RouteRule {
  repeated string users = 1;
  repeated string rule_sets = 2;
  RouteAction action = 3;
  string outbound = 4;
}
message GetRouteRulesRequest {}
message GetRouteRulesResponse { repeated RouteRule rules = 1; }
message RemoveRouteRuleRequest { uint32 index = 1; }
message RemoveRouteRuleResponse {}

message DNSRoute {
  string rule_set = 1; // Empty for a catch-all rule.
  string outbound = 2; // direct or mesh outbound tag.
}
message SyncDNSRoutesRequest {
  repeated DNSRoute routes = 1;
  repeated string managed_rule_sets = 2;
}
message SyncDNSRoutesResponse {}
